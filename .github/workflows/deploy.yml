name: Deploy MuleSoft App to CloudHub 2.0

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Anypoint Environment'
        required: true
        default: 'Sandbox'
        type: choice
        options:
          - Sandbox
          - Production

      target:
        description: 'CloudHub 2.0 Shared Space Target'
        required: true
        default: 'Cloudhub-US-East-2'
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings.xml for Anypoint Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>anypoint-exchange-sandbox</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOF

      # - name: Show Maven settings
        # run: |
          # echo "===== settings file CONTENT ====="
          # cat ~/.m2/settings.xml | sed 's/<password>.*<\/password>/<password>****<\/password>/'

      # - name: Verify generated artifacts
        # run: |
          # mvn clean package
          # echo "===== TARGET CONTENT ====="
          # ls -la target

      # - name: Verify jar content
        # run: |
          # echo "===== VERIFY JAR CONTENT ====="
          # jar tf target/test-1.0.1-mule-application.jar | grep mule-artifact.json

      # - name: Show effective pom exchange section
        # run: |
          # echo "===== POM EXCHANGE SECTION ====="
          # mvn help:effective-pom -Doutput=effective-pom.xml
          # grep -A 40 -B 5 "exchange-mule-maven-plugin" effective-pom.xml || true

      # - name: Verify Mule artifact inside JAR
        # run: |
          # echo "===== VERIFY MULE ARTIFACT INSIDE JAR ====="
          # jar tf target/test-1.0.1-mule-application.jar | sort

      - name: Build and Deploy to CloudHub 2.0 Shared Space
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn clean deploy \
            -DmuleDeploy \
            -Denv="${{ inputs.environment }}" \
            -Dtarget="${{ inputs.target }}" \
            -DconnectedAppClientId="$ANYPOINT_CLIENT_ID" \
            -DconnectedAppClientSecret="$ANYPOINT_CLIENT_SECRET"
